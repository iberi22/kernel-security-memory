name: Fix fingerprints

on:
  schedule:
    # Wednesdays at 04:41 UTC.
    - cron: "41 4 * * 3"
  workflow_dispatch:
    inputs:
      max_commits:
        description: Fix commits to fingerprint in this run
        default: "300"

permissions: {}

concurrency:
  group: fingerprints
  cancel-in-progress: false

env:
  AUTOMATION_BRANCH: automation/fingerprints
  # Xavier commit whose `code-graph fingerprint` produces ksm-sfp/1.
  XAVIER_REV: 229aa969aaac293ea9a4dee6f3999d19b178b4ce

jobs:
  build:
    name: Fingerprint fix commits
    runs-on: ubuntu-latest
    # Read-only: the GitHub token is used for commit API reads (5,000 requests
    # per hour instead of 60). Writing happens in the propose job.
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Progress lives on the automation branch until its PR is merged.
      - name: Resume the automation branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${AUTOMATION_BRANCH}:refs/remotes/origin/${AUTOMATION_BRANCH}" || true
          if git rev-parse --verify --quiet "refs/remotes/origin/${AUTOMATION_BRANCH}" >/dev/null; then
            git checkout -B "$AUTOMATION_BRANCH" "refs/remotes/origin/${AUTOMATION_BRANCH}"
            git -c user.name=ci -c user.email=ci@invalid merge --no-edit origin/main
          else
            git checkout -B "$AUTOMATION_BRANCH"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Restore code-graph
        id: cg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/code-graph
          key: code-graph-${{ runner.os }}-${{ env.XAVIER_REV }}

      - name: Build code-graph at the pinned Xavier commit
        if: steps.cg-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cargo install --locked --git https://github.com/iberi22/xavier --rev "$XAVIER_REV" \
            code-graph --root "$RUNNER_TEMP/code-graph"

      - name: Fingerprint the next fix commits
        run: |
          set -euo pipefail
          export KSM_CODE_GRAPH="$RUNNER_TEMP/code-graph/bin/code-graph"
          "$KSM_CODE_GRAPH" --version || true
          python3 scripts/fingerprints/build_fix_fingerprints.py \
            --max-commits "$MAX_COMMITS" --tool "code-graph@${XAVIER_REV:0:8}" | tee "$RUNNER_TEMP/fingerprints.log"
          python3 scripts/fingerprints/match.py \
            --fingerprints docs/studies/fingerprints --self-test | tee -a "$RUNNER_TEMP/fingerprints.log"
          python3 -m unittest discover -s tests -p "test_*.py"
          # Intent-to-add makes new files part of the diff without staging content.
          git ls-files --others --exclude-standard -z docs/studies/fingerprints \
            | xargs -0 -r git add -N
          git diff --binary HEAD -- docs/studies/fingerprints > "$RUNNER_TEMP/fingerprints.patch"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAX_COMMITS: ${{ inputs.max_commits || '300' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fingerprints
          path: |
            ${{ runner.temp }}/fingerprints.patch
            ${{ runner.temp }}/fingerprints.log
          retention-days: 7

  propose:
    name: Propose fingerprints as a pull request
    needs: build
    runs-on: ubuntu-latest
    # Pushes the automation branch and opens or updates its pull request.
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fingerprints
          path: ${{ runner.temp }}/artifact

      - name: Apply and propose
        run: |
          set -euo pipefail
          branch="$AUTOMATION_BRANCH"
          git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          if git rev-parse --verify --quiet "refs/remotes/origin/${branch}" >/dev/null; then
            git checkout -B "$branch" "refs/remotes/origin/${branch}"
            git -c user.name=ci -c user.email=ci@invalid merge --no-edit origin/main
          else
            git checkout -B "$branch"
          fi

          patch="$RUNNER_TEMP/artifact/fingerprints.patch"
          if [ ! -s "$patch" ]; then
            echo "No new fingerprints; nothing to propose."
            exit 0
          fi
          git apply --index "$patch"
          # Only fingerprint files may change through this workflow.
          if git diff --cached --name-only | grep -v '^docs/studies/fingerprints/'; then
            echo "::error::patch touches files outside docs/studies/fingerprints"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(studies): fix fingerprints batch"

          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${basic}" \
            push origin "HEAD:refs/heads/$branch"

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
            exit 0
          fi
          {
            echo "Automated batch of fix fingerprints (\`ksm-fixfp/1\`, produced by Xavier \`code-graph fingerprint\` at \`$XAVIER_REV\`)."
            echo
            echo "Fingerprints hold hashes, names and line numbers only; no source code."
            echo
            echo '```'
            tail -n 40 "$RUNNER_TEMP/artifact/fingerprints.log"
            echo '```'
          } > "$RUNNER_TEMP/pr_body.md"
          gh pr create --base main --head "$branch" \
            --title "chore(studies): fix fingerprints batch" --body-file "$RUNNER_TEMP/pr_body.md"
        env:
          GH_TOKEN: ${{ github.token }}
