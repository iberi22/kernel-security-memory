name: Verify evidence pack
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate, test and check reproducible export
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/build_pack.py --check
