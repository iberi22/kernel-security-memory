name: Publish vulnerability atlas

on:
  push:
    branches: [main]
  schedule:
    # Tuesdays at 06:23 UTC, after the Monday catalog refresh.
    - cron: "23 6 * * 2"
  workflow_dispatch:

permissions: {}

# Only the newest deployment matters; an older one still building is replaced.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site data and UI
    runs-on: ubuntu-latest
    # Reads the checkout only; no token is needed to build.
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit time pins `generated` in index.json.
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build site data
        run: |
          set -euo pipefail
          python3 scripts/site/build_site_data.py --out site/data
          # Paths the legacy /docs Pages site served keep working:
          # /memory/manifest.json (PORTABLE-MEMORY.md, open_pack.py) and /schemas/ ($id URLs).
          cp -r docs/memory site/memory
          cp -r docs/schemas site/schemas
          cp docs/review.html site/review.html
          du -sh site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Exactly what actions/deploy-pages requires.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
