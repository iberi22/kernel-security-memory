# Default gitleaks rules plus one scoped exception.
[extend]
useDefault = true

# Fix fingerprints (docs/studies/fingerprints/, generated by
# scripts/fingerprints/build_fix_fingerprints.py) list callee and argument
# identifiers of upstream code, e.g. RSA_PKCS1_OAEP_PADDING next to another
# name, which generic-api-key reads as a key/value pair. Only that rule is
# relaxed, and only for those generated files; every other rule still applies.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
paths = ['''docs/studies/fingerprints/.+\.json$''']
